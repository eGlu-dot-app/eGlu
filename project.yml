# eGlu's Xcode project, made from this file with XcodeGen
# (https://github.com/yonaskolb/XcodeGen): run `xcodegen` in this folder after
# adding or removing a file. eGlu.xcodeproj is committed as generated, so
# building needs nothing but Xcode.
name: eGlu
options:
  deploymentTarget:
    iOS: "17.0"
    # The Mac app is drawn in Liquid Glass throughout, which macOS has from 26.
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
# Test: Debug, as the scheme "eGlu Mac Page Tests" builds eGlu Mac to host its
# tests: an identifier, a data folder and ad-hoc signing of its own, so a
# test run never touches the real app's preferences, website data or files
# (eGlu Mac's settings below). Debug and Release are as they were.
configs:
  Debug: debug
  Release: release
  Test: debug
settings:
  base:
    # Swift 5's language mode: what Swift 6's checks would stop is shown as
    # warnings where it is turned on (the iOS app, PadCore), one step at a
    # time (Docs/iPhoneDuoPlan.md, Phase E).
    SWIFT_VERSION: "5.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: "1.1.3"
    CURRENT_PROJECT_VERSION: "54"
packages:
  WritingServiceKit:
    path: WritingServiceKit
  DocumentServiceKit:
    path: DocumentServiceKit
  EnginePlugins:
    path: EnginePlugins
  WebEngineKit:
    path: WebEngineKit
  WebKitEngine:
    path: WebKitEngine
  PadCore:
    path: PadCore
  # The Rust engines (Harper for grammar, anydoc and pdf-inspector for
  # documents) as a pinned binary: see Engines/README.md. Build with
  # EGLU_ENGINES_LOCAL=1 until an engines-<version> release exists.
  Engines:
    path: Engines
  # Updates for the Mac app people download (eGlu Mac Direct only; the
  # eGlu Mac target, run from Xcode, never has it). Pinned: a new version is a decision.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
# What both Mac targets are: the one run from Xcode and the one people download.
targetTemplates:
  MacApp:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Mac.xcconfig
      Release: Config/Mac.xcconfig
      Test: Config/Mac.xcconfig
    # What only the Mac has (Mac/), and what both apps compile (Shared/).
    # Not the Dock tile plug-in's own: it is a target of its own.
    sources:
      - path: Mac
        excludes:
          - DockTile/**
      - path: Shared
    dependencies:
      - package: PadCore
      - package: WritingServiceKit
      - package: DocumentServiceKit
      - package: EnginePlugins
        product: HarperPlugin
      - package: EnginePlugins
        product: DocumentsPlugin
      - package: WebEngineKit
        product: WebEngineCore
      - package: WebEngineKit
        product: WebEngineAppKit
      - package: WebKitEngine
        product: WebKitMacPlugin
      - package: WebKitEngine
        product: WebKitExtensions
      - package: WebKitEngine
        product: WebKitSupport
      # In Contents/PlugIns, where the Dock looks for the plug-in Mac/Info.plist names.
      - target: eGlu Dock Tile
        embed: true
        codeSign: true
        copy:
          destination: plugins
    # The interface talks to its engines only through contracts
    # (Docs/WebEngine.md): no file of Mac/ or Shared/ imports WebKit or
    # Engines, and only Mac/Sources/EngineComposition.swift imports the
    # WebKit plugin's modules. The build stops at the first that does.
    preBuildScripts:
      - name: Engine boundary
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT"
          /usr/bin/python3 Tests/engine-inventory.py --strict
    settings:
      base:
        PRODUCT_NAME: eGlu
        PRODUCT_MODULE_NAME: eGluMac
        INFOPLIST_FILE: Mac/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Shared/eGlu.icon, the same icon the iPhone and iPad have.
        ASSETCATALOG_COMPILER_APPICON_NAME: eGlu
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: NO
        COMBINE_HIDPI_IMAGES: YES
targets:
  eGlu:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
      Test: Config/Signing.xcconfig
    # What only the iPhone and iPad have (App/), and what both apps compile (Shared/).
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: WebEngineKit
        product: WebEngineCore
      - package: PadCore
      - package: Engines
      - package: WritingServiceKit
      - package: DocumentServiceKit
      - package: EnginePlugins
        product: HarperPlugin
      - package: EnginePlugins
        product: DocumentsPlugin
      - package: WebKitEngine
        product: WebKitSupport
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        # Shared/eGlu.icon, made with Icon Composer: Liquid Glass on iOS and
        # iPadOS 26 and later; Xcode draws flat pictures from it for earlier ones.
        ASSETCATALOG_COMPILER_APPICON_NAME: eGlu
        # The icons Settings › App icon offers, each an Icon Composer file in App/.
        # Globe was the app's own icon up to 1.0.7.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: Astro Designer Engineer Globe Hardcover Punk Signal Vista
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
        # Apple Intelligence's on-device model (Intelligence.swift) is iOS 26's;
        # linked weakly, the app still starts without it on iOS 17 and 18.
        OTHER_LDFLAGS: ["$(inherited)", "-weak_framework", "FoundationModels"]
        # Every data race Swift 6 would refuse, as a warning: the app is
        # main-thread by nature, but the workspace's saves, sites' icons and
        # the stores work off it.
        SWIFT_STRICT_CONCURRENCY: complete
        # Swift 6.2's defaults: an async function with no actor of its own
        # runs on its caller's (@concurrent sends it away), and conformances
        # and closures take the isolation they are written in.
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        # Everything on the main actor unless it says otherwise: what works
        # off it (the snapshots' files, the share sheet's file) says so.
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  # eGlu's tile in the Dock while eGlu isn't open, a plug-in the Dock loads
  # from both Mac apps (Mac/DockTile/DockTile.swift): the icon chosen in
  # Settings › General › App Icon.
  eGlu Dock Tile:
    type: bundle
    platform: macOS
    configFiles:
      Debug: Config/DockTile.xcconfig
      Release: Config/DockTile.xcconfig
      Test: Config/DockTile.xcconfig
    sources:
      - path: Mac/DockTile
      - path: Mac/Sources/DockIconKeys.swift
    settings:
      base:
        PRODUCT_NAME: eGluDockTile
        WRAPPER_EXTENSION: docktileplugin
        INFOPLIST_FILE: Mac/DockTile/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        # In the app, not beside it in an archive.
        SKIP_INSTALL: YES
      configs:
        # Signed as the test host it is in is (eGlu Mac's Test settings).
        Test:
          PRODUCT_BUNDLE_IDENTIFIER: net.taehee.safience.pagetests.docktile
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
          DEVELOPMENT_TEAM: ""
          ENABLE_HARDENED_RUNTIME: NO
  Site Icons Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Shared/SiteIcons.swift
      - path: Tests/SiteIconsTests.swift
    dependencies:
      - package: WebKitEngine
        product: WebKitSupport
      - package: WebEngineKit
        product: WebEngineCore
      - package: PadCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.taehee.safience.site-icons-tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  # The Mac app's Page against a real WKWebView (Tests/MacPage), inside
  # eGlu Mac as the Test configuration builds it (scheme eGlu Mac Page Tests).
  eGlu Mac Page Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MacPage
    dependencies:
      - target: eGlu Mac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.taehee.safience.pagetests.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/eGlu.app/Contents/MacOS/eGlu
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
  # eGlu for Mac: the same spaces, pinned tabs and blocking, in a window
  # with Arc's sidebar down its side and the page beside it. Its own sources
  # in Mac/, with the few of the iPad's that are WebKit and Foundation only.
  eGlu Mac:
    templates: [MacApp]
    settings:
      configs:
        # The page tests' host. Its own identifier, so its preferences,
        # website data and caches are its own; its own data folder, in the
        # build folder, written into its Info.plist (Session.dataRootOverride)
        # as well as set by the scheme. Signed only to run here, without
        # iCloud, and without the hardened runtime, which would refuse to
        # load an ad-hoc test bundle into it.
        Test:
          PRODUCT_BUNDLE_IDENTIFIER: net.taehee.safience.pagetests
          EGLU_DATA_ROOT: $(OBJROOT)/eGluPageTestsData
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
          DEVELOPMENT_TEAM: ""
          MAC_ENTITLEMENTS: Config/eGluMacLocal.entitlements
          MAC_PROFILE: ""
          ENABLE_HARDENED_RUNTIME: NO
  # eGlu for Mac as a disk image to download (Release/mac.sh): the same
  # app, with Sparkle to update itself (Mac/Sources/Updates.swift, DIRECT).
  eGlu Mac Direct:
    templates: [MacApp]
    dependencies:
      - package: Sparkle
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DIRECT
        # Without iCloud unless Release/mac.sh says otherwise (ICLOUD=1).
        MAC_ENTITLEMENTS: Config/eGluMacDirect.entitlements
        # Where updates are announced, and the key their disk images are
        # signed with (Release/mac.sh release; the private half is in the
        # Keychain of the Mac that releases, account "safience").
        SPARKLE_FEED_URL: https://github.com/eGlu-dot-app/eGlu/releases/latest/download/appcast.xml
        SPARKLE_PUBLIC_KEY: rK6S7D1ycM2mnd6WoTripO25xn0wVuV6ymEeI/+jlrc=
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      # Sparkle's keys, in this target's Info.plist only (Mac/Info.plist is both apps').
      - name: Sparkle's keys in Info.plist
        basedOnDependencyAnalysis: false
        # After Xcode has written the app's Info.plist, which it orders by this.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          plutil -replace SUFeedURL -string "$SPARKLE_FEED_URL" "$plist"
          plutil -replace SUPublicEDKey -string "$SPARKLE_PUBLIC_KEY" "$plist"
          plutil -replace SUEnableAutomaticChecks -bool YES "$plist"
schemes:
  Site Icons Tests:
    build:
      targets:
        Site Icons Tests: [test]
    test:
      targets:
        - Site Icons Tests
  # The Mac page tests, in eGlu Mac built as Test. EGLU_DATA_ROOT here as
  # in the host's Info.plist: either keeps the run out of the real data
  # folder, and without one the host refuses to run tests (AppDelegate).
  eGlu Mac Page Tests:
    build:
      targets:
        eGlu Mac Page Tests: [test]
    test:
      config: Test
      targets:
        - eGlu Mac Page Tests
      environmentVariables:
        EGLU_DATA_ROOT: $(OBJROOT)/eGluPageTestsData
      commandLineArguments:
        "-ApplePersistenceIgnoreState YES": true
  eGlu:
    build:
      targets:
        eGlu: all
    run:
      config: Debug
    archive:
      config: Release
  eGlu Mac:
    build:
      targets:
        eGlu Mac: all
    run:
      config: Debug
    archive:
      config: Release
  eGlu Mac Direct:
    build:
      targets:
        eGlu Mac Direct: all
    run:
      config: Debug
    archive:
      config: Release
